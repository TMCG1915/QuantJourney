[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bs-pricer-app"
version = "0.1.0"
description = "Black-Scholes option pricer: closed form, binomial tree and Monte Carlo, with a Streamlit dashboard."
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
app = ["streamlit"]
dev = ["pytest"]

[tool.setuptools]
packages = ["common", "bs_pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
